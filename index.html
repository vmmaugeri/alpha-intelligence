<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpha Intelligence — Valerio Marco Maugeri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">
  <a class="back" href="/">&larr; Valerio Marco Maugeri</a>

  <main>
    <h1>Alpha Intelligence</h1>
    <p class="subtitle">Live paper portfolio &middot; started 1 Aug 2026</p>

    <div class="market-status">
      <span class="status-dot" id="statusDot"></span>
      <span id="marketStatusText">NYSE &mdash;</span>
    </div>

    <div class="stat-row">
      <div class="stat-value" id="currentValue">Loading&hellip;</div>
      <div class="stat-change" id="allTimeChange"></div>
    </div>

    <div class="chart-range" id="chartRange">
      <button class="range-btn" type="button" data-range="24H">24H</button>
      <button class="range-btn active" type="button" data-range="1W">1W</button>
      <button class="range-btn" type="button" data-range="1M">1M</button>
    </div>

    <div class="chart-wrap">
      <canvas id="chart"></canvas>
      <div class="chart-tooltip" id="chartTooltip"></div>
    </div>

    <ul class="positions" id="positions"></ul>

    <p class="updated" id="updated"></p>
  </main>
</div>

<script src="script.js"></script>
</body>
</html>
