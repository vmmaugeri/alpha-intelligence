<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpha Intelligence — Valerio Marco Maugeri</title>
<link rel="icon" id="favicon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📈</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">
  <a class="back" href="https://valerio-site.vercel.app/">&larr; Valerio Marco Maugeri</a>

  <main>
    <h1>Alpha Intelligence</h1>
    <p class="subtitle">Live paper portfolio &middot; started 1 Aug 2026</p>

    <div class="market-status">
      <span class="status-dot" id="statusDot"></span>
      <span id="marketStatusText">Market &mdash;</span>
    </div>

    <div class="stat-row">
      <div class="stat-value" id="currentValue">Loading&hellip;</div>
      <div class="stat-change" id="allTimeChange"></div>
    </div>

    <div class="chart-range" id="chartRange">
      <button class="range-btn" type="button" data-range="24H">24H</button>
      <button class="range-btn active" type="button" data-range="1W">1W</button>
      <button class="range-btn" type="button" data-range="1M">1M</button>
      <button class="range-btn" type="button" data-range="All">All</button>
    </div>

    <div class="chart-wrap">
      <canvas id="chart"></canvas>
      <div class="chart-tooltip" id="chartTooltip"></div>
    </div>

    <div class="chart-legend" id="chartLegend">
      <span class="legend-item"><span class="legend-dot legend-dot--portfolio"></span>Portfolio</span>
      <span class="legend-item"><span class="legend-dot legend-dot--benchmark"></span>S&amp;P 500</span>
    </div>

    <div class="positions-wrap">
      <div class="positions-header">
        <span></span>
        <span class="positions-header-right">
          <span>All-time</span>
          <span>Weight</span>
        </span>
      </div>
      <ul class="positions" id="positions"></ul>
    </div>

    <div class="movers">
      <div class="mover">
        <span class="mover-label">Today&rsquo;s Gainer</span>
        <span class="mover-value" id="gainerValue">&mdash;</span>
      </div>
      <div class="mover">
        <span class="mover-label">Today&rsquo;s Loser</span>
        <span class="mover-value" id="loserValue">&mdash;</span>
      </div>
    </div>

    <div class="closed-wrap">
      <div class="closed-header">Closed &amp; Trimmed Positions</div>
      <ul class="closed-positions" id="closedPositions"></ul>
    </div>

    <p class="updated" id="updated"></p>
  </main>
</div>

<script src="script.js"></script>
</body>
</html>
